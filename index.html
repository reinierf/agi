<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>
    <title>AGI</title>
    <link rel="icon" id="favicon" href="data:;base64,iVBORw0KGgo=">
    <style>
        body {
            background: #666;
        }

        #app {
            width: 640px;
            margin: auto;
        }

        canvas {
            background: #333;
            image-rendering: -moz-crisp-edges;
            image-rendering: pixelated;
        }

        canvas#canvas {
            outline: 1px solid #aaa;
            width: 640px;
            height: 400px;
        }

        canvas.item {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            height: 300px;
            font-size: 10px;
        }

        #game-picker {
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 6px;
        }

        #menu select {
            appearance: none;
            border: none;
            font-family: monospace;
            margin: 0;
            font-size: 12px;
            font-weight: bold;
            padding: 4px;
        }

        #menu #score {
            display: inline-block;
            font-family: monospace;
            font-size: 12px;
            margin: 0 0 0 4px;
            color: white;
            float: right;
            line-height: 1.5em;
        }

        #actions {
            overflow: auto;
            white-space: nowrap;
            width: 640px;
            scroll-snap-type: x proximity;
            overscroll-behavior-x: contain;
        }

        #actions .list {
            vertical-align: top;
            scroll-snap-align: start;
            display: inline-block;
            width: 140px;
            overflow-y: auto;
            max-height: calc(100vh - 400px - 80px);
            transition: all 0.25s ease;
        }

        #actions .list.hide {
            width: 0;
            overflow: hidden;
            height: 0;
        }

        #actions .list button {
            background: #222;
            border: none;
            border-right: #888 2px solid;
            color: white;
            text-align: left;
            display: block;
            appearance: none;
            font-family: monospace;
            font-size: 12px;
            padding: 4px;
            cursor: pointer;
            margin-bottom: 4px;
            white-space: normal;
            width: 100%;
            transition: all 0.2s ease;
        }

        #actions .list button:hover {
            color: #d31;
        }

        #actions .list button.hide {
            width: 0;
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        #debug {
            position: absolute;
            top: 0;
            right: 0;
        }

        #debug img {
            outline: 1px solid blue;
        }

        #overlay {
            display: none;
            position: fixed;
            opacity: 0.4;
        }

        [hidden] {
            display: none !important;
        }

        #debug-panel {
            position: fixed;
            top: 8px;
            right: 8px;
            width: 340px;
            max-height: calc(100vh - 16px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 8px;
            background: rgba(17, 17, 17, 0.94);
            color: #ddd;
            border: 1px solid #555;
            font: 12px/1.4 monospace;
            z-index: 10;
        }

        #debug-panel .debug-hint {
            color: #888;
        }

        #debug-panel .debug-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 6px 0;
        }

        #debug-panel button {
            font: inherit;
            padding: 2px 6px;
        }

        #debug-panel h4 {
            margin: 8px 0 2px;
            color: #9cf;
            font-size: 12px;
        }

        #debug-panel .debug-message {
            white-space: pre-wrap;
        }

        #debug-panel .debug-option {
            display: block;
            color: #aaa;
        }

        #debug-panel .debug-priority {
            width: 100%;
            margin-top: 8px;
            image-rendering: pixelated;
        }

        #player-input {
            display: block;
            appearance: none;
            border: 0;
            font-family: monospace;
            font-size: 12px;
            width: 640px;
            box-sizing: border-box;
            padding: 4px;
            margin-top: 6px;
            margin-bottom: 8px;
        }

        @keyframes screenshake {
            0% {
                transform: translate(0px, 0px);
            }
            25% {
                transform: translate(-4px, -4px);
            }
            50% {
                transform: translate(0px, 0px);
            }
            75% {
                transform: translate(4px, 4px);
            }
            100% {
                transform: translate(0px, 0px);
            }
        }


    </style>
</head>
<body>

<div id="app">
    <select id="game-picker" aria-label="Game"><option>Looking for games…</option></select>
    <div id="menu"></div>
    <canvas id="canvas" width="320" height="200"></canvas>
    <!-- jsyang's word-group buttons: a debug view, hidden unless ?wordbuttons is in the URL -->
    <input type="search" id="player-input" aria-label="Filter word groups" hidden>
    <div id="actions" hidden></div>
    <img id="overlay" src="games/comparison.png" alt="GFX comparison overlay"
         ondragstart="event.preventDefault()"
         onmousedown="dragX=event.offsetX;dragY=event.offsetY;isDrag=true"
         onmouseup="isDrag=false"
    >
</div>
<div id="debug"></div>
<aside id="debug-panel" aria-label="Debug panel" hidden></aside>
<script type="module" src="./src/index.js"></script>
<script>
    // let isDrag = false;
    // let dragX  = 0;
    // let dragY  = 0;
    //
    // addEventListener('mousemove', e => {
    //     if (!isDrag) return;
    //     const o      = document.getElementById('overlay');
    //     o.style.left = e.clientX - dragX + 'px';
    //     o.style.top  = e.clientY - dragY + 'px';
    // });

    const canvas = document.getElementById("canvas");

    // Games load and start from the game picker; clicking the screen pauses and resumes.
    canvas.onclick = e => {
        if (!AGI.hasStarted) return;

        AGI.togglePause();

        const {left, top} = canvas.getBoundingClientRect();
        document.title    = `(${(e.clientX - left) >> 2}, ${(e.clientY + 1 - top) >> 1})`;
    };
</script>
</body>
</html>
